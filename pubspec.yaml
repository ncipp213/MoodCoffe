name: MoodCoffee
description: A new Flutter project for coffee shop experience.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.0.7

  # Ikon standar Cupertino untuk iOS style
  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/cover.jpeg
    - assets/cappucino.png
    - assets/gula_aren.jpg
    - assets/latte.png
    - assets/americano.png