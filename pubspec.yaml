name: MoodCoffee
description: A new Flutter project for coffee shop experience.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  json_annotation: ^4.9.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  image_picker: ^1.0.7
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  # Firebase (jika digunakan nanti, tambahkan)

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  json_serializable: ^6.8.0
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/cover.jpeg
    - assets/cappucino.png
    - assets/gula_aren.jpg
    - assets/latte.png
    - assets/americano.png