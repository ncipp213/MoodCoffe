name: MoodCoffee
description: A new Flutter project for coffee shop experience.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Ikon standar Cupertino untuk iOS style
  cupertino_icons: ^1.0.6

  # (Tambahkan dependensi lain jika diperlukan, misalnya: provider, http, dll)

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Aset gambar lokal
  assets:
    - assets/cover.jpeg     # Background login screen

  # (Opsional) Font kustom
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: assets/fonts/CustomFont-Regular.ttf