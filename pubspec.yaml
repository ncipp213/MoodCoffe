name: MoodCoffee
description: A new Flutter project for coffee shop experience.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Utilities
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  image_picker: ^1.0.7
  barcode_widget: ^2.0.4
  shared_preferences: ^2.5.5
  
  # JSON
  json_annotation: ^4.9.0
  
  # SQLite database via sqflite 
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  
  # Untuk generate model JSON 
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/cover.jpeg
    - assets/cappucino.png
    - assets/gula_aren.jpg
    - assets/latte.png
    - assets/americano.png